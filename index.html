<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN-SAID-MD Pairing</title>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; display: inline-block; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; font-size: 16px; text-align: center; }
        button { background: #22c55e; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%; }
        button:hover { background: #16a34a; }
        #result { margin-top: 20px; font-size: 20px; color: #4ade80; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>BIN-SAID-MD</h2>
        <p>Enter your WhatsApp number (e.g., 2557XXXXXXXX):</p>
        <input type="text" id="phone" placeholder="255712345678">
        <br>
        <button onclick="getPairCode()">Generate Pair Code</button>
        <div id="result"></div>
    </div>

    <script>
        async function getPairCode() {
            const phone = document.getElementById('phone').value.trim();
            const resultDiv = document.getElementById('result');
            
            if(!phone) {
                alert("Please enter your phone number!");
                return;
            }
            
            resultDiv.innerText = "Generating code, please wait...";
            
            try {
                const response = await fetch(`https://binsaid-backend-1.onrender.com/pair?phone=${phone}`);
                const data = await response.json();
                
                if(data.code) {
                    resultDiv.innerText = `Your Code: ${data.code}`;
                } else {
                    resultDiv.innerText = data.error || "Failed to generate code.";
                }
            } catch(e) {
                resultDiv.innerText = "Network error occurred.";
            }
        }
    </script>
</body>
</html>
